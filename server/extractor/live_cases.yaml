    timeout: 35
    expect:
      title_contains:
        - Sleep Optimization Discussion
      text_contains:
        - "User:"
        - "Assistant:"
      min_text_length: 100
      preview_contains:
        - User
        - Assistant
      min_preview_length: 100

  - name: ytdlp_archive_big_buck_bunny
    url: https://archive.org/details/BigBuckBunny_328
    fetch: false
    extractor: Ytdlp
    requires_binary: yt-dlp
    timeout: 30
    run_chain: false
    expect:
      title_contains:
        - Big Buck Bunny
      min_text_length: 50
      metadata_minimums:
        duration: 500
      preview_contains:
        - Big Buck Bunny
      min_preview_length: 100

  - name: readability_wikipedia_article_http
    url: https://en.wikipedia.org/wiki/Web_scraping
