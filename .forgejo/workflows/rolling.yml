name: Rolling Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: forgejo.repository == 'asciimoo/hister'
    name: GoReleaser rolling build
    runs-on: runner_name
    container:
      image: goreleaser/goreleaser-cross:v1.25.5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: latest

        # Mark the checkout as 'safe' despite being owned by `root`
      - run: git config --global --add safe.directory "$FORGEJO_WORKSPACE"
      - run: git config --global --add safe.directory "$(pwd)"

      - name: Generate front-end
        run: go generate ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@master
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean -f .goreleaser-rolling.yml

      - name: Force Update 'Rolling' Tag
        run: |
          git tag -f rolling
          git push origin rolling --force

      - name: Generate release body
        id: release_body
        run: |
          echo "body<<EOF" >> $FORGEJO_OUTPUT
          echo "Automated build from master." >> $FORGEJO_OUTPUT
          echo "Commit: ${{ forgejo.sha }}" >> $FORGEJO_OUTPUT
          echo "Built on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $FORGEJO_OUTPUT
          echo "EOF" >> $FORGEJO_OUTPUT

      - name: Update Latest Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: rolling
          name: 'Nogon (Dev Build)'
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          make_latest: true
          files: |
            dist/nogon_cgo_*
            dist/hister_cgo_*
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
