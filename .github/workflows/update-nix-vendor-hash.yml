name: Update Nix hashes

on:
  push:
    branches:
      - master
    paths:
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - flake.nix
      - flake.lock
      - nix/package.nix
      - .github/workflows/update-nix-vendor-hash.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hashes:
    if: github.repository == 'asciimoo/nogon'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.5

      - name: Update Nix hashes
        shell: bash
        run: |
          # Evaluate the checkout directly. Nix 2.35 flake metadata can return
          # source paths that have not been copied into the store.
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          if nix build --impure --no-link --expr '
            let
              flake = builtins.getFlake ("git+file://" + toString ./.);
              package = flake.packages.${builtins.currentSystem}.nogon;
            in package.goModules.overrideAttrs (_: {
              outputHash = "";
              outputHashAlgo = "sha256";
            })
          ' 2>"$log"; then
            echo "Expected the dependency build to report its hash" >&2
            exit 1
          fi
          cat "$log"
          hash=$(sed -nE 's/^[[:space:]]+got:[[:space:]]+(sha256-[A-Za-z0-9+/]{43}=)[[:space:]]*$/\1/p' "$log")
          if [[ ! "$hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "Could not determine a single Go vendor hash" >&2
            exit 1
          fi
          sed -i -E "s|^(  vendorHash = \")[^\"]*(\";)$|\1$hash\2|" nix/package.nix
          nix build --no-link .#nogon

      - name: Check package and service compatibility
        run: nix build --no-link .#checks.x86_64-linux.compatibility

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet nix/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update-nix-hashes
          commit-message: '[chore] update Nix vendor hash'
          title: 'Update Nix hashes'
          body: |
            [chore] update vendorHash in nix/package.nix and verify the package build

            Triggered by: ${{ github.repository }}@${{ github.sha }}
          delete-branch: true
