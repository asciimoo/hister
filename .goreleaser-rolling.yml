---
version: 2
project_name: nogon

snapshot:
  version_template: 'latest'

builds:
  - id: build_cgo
    binary: nogon
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
    ignore:
      - goos: windows
        goarch: arm64
    overrides:
      - goos: windows
        goarch: amd64
        env:
          - CC=x86_64-w64-mingw32-gcc
          - CGO_LDFLAGS=-lssp -static
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CGO_LDFLAGS=-static
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CGO_LDFLAGS=-static
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
    hooks:
      # Keep the original build path valid for GoReleaser metadata.
      post:
        - cp "{{ .Path }}" "{{ dir (dir .Path) }}/nogon_cgo_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ .Ext }}"
        - cp "{{ .Path }}" "{{ dir (dir .Path) }}/hister_cgo_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ .Ext }}"

release:
  replace_existing_artifacts: true

archives:
  - formats: ['binary']
